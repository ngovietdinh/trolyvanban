# Chẩn đoán bản macOS: chạy thử nhiều biến thể đóng gói để tìm nguyên nhân ứng dụng thoát sớm.
name: Chẩn đoán bản macOS

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/desktop.mjs
      - working-directory: desktop
        run: npm ci
      - name: Thử chạy
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set +e
          try() {
            label="$1"; bin="$2"; shift 2
            echo "::group::$label"
            "$bin" "$@" --enable-logging=stderr > "log-$label.txt" 2>&1 &
            pid=$!
            for i in $(seq 1 15); do sleep 1; kill -0 $pid 2>/dev/null || break; done
            if kill -0 $pid 2>/dev/null; then echo "RESULT $label: OK (còn chạy)"; kill $pid; else wait $pid; echo "RESULT $label: THOÁT mã $? sau ${i}s"; fi
            tail -40 "log-$label.txt"
            echo "::endgroup::"
          }
          try A-electron-goc ./node_modules/electron/dist/Electron.app/Contents/MacOS/Electron .
          npx electron-builder --mac dir --arm64 --publish never > b1.txt 2>&1 || tail -30 b1.txt
          APP="$(ls -d dist/mac-arm64/*.app)"; try B-dong-goi "$APP/Contents/MacOS/$(basename "$APP" .app)"
          rm -rf dist
          npx electron-builder --mac dir --arm64 --publish never -c.afterPack=null > b2.txt 2>&1 || tail -30 b2.txt
          APP="$(ls -d dist/mac-arm64/*.app)"; codesign -dv "$APP" 2>&1 | grep Signature; try C-khong-ky-lai "$APP/Contents/MacOS/$(basename "$APP" .app)"
          rm -rf dist
          npx electron-builder --mac dir --arm64 --publish never -c.productName=TroLyVanBan > b3.txt 2>&1 || tail -30 b3.txt
          APP="$(ls -d dist/mac-arm64/*.app)"; try D-ten-ascii "$APP/Contents/MacOS/$(basename "$APP" .app)"
          sleep 5
          echo "::group::crash reports"
          ls -t ~/Library/Logs/DiagnosticReports/ /Library/Logs/DiagnosticReports/ 2>/dev/null | head -20
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -2); do head -c 6000 "$f"; echo; done
          echo "::endgroup::"
          grep -h "RESULT" -r . --include=nothing 2>/dev/null; true
