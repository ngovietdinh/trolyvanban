# Đóng gói bộ cài đặt máy tính (Windows .exe, macOS .dmg) và đăng lên GitHub Releases.
# Tự chạy khi version.json trên main đổi (mỗi lần phát hành), hoặc chạy tay ở tab Actions.
name: Bộ cài đặt máy tính

on:
  push:
    branches: [main]
    paths: [version.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Chuẩn bị mã web
        run: node scripts/desktop.mjs
      - name: Cài Electron
        working-directory: desktop
        run: npm ci
      - name: Đóng gói
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # macOS: tên gói .app có dấu tiếng Việt làm Electron crash khi mở (Trace/BPT trap) →
        # tên gói không dấu, tên hiển thị trong Finder/Dock vẫn có dấu.
        run: |
          if [ "${{ matrix.target }}" = mac ]; then
            npx electron-builder --mac --publish never -c.productName="Tro Ly Van Ban AI" -c.mac.extendInfo.CFBundleDisplayName="Trợ Lý Văn Bản AI"
          else
            npx electron-builder --win --publish never
          fi
        shell: bash
      - name: Kiểm tra chữ ký và mở thử ứng dụng (macOS)
        if: matrix.target == 'mac'
        working-directory: desktop
        run: |
          APP="$(ls -d dist/mac-arm64/*.app)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier|Format'
          # Giả lập tệp tải từ mạng (có cờ quarantine), gỡ cờ như hướng dẫn người dùng rồi mở.
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Chrome;" "$APP"
          xattr -cr "$APP"
          ELECTRON_ENABLE_LOGGING=1 "$APP/Contents/MacOS/$(basename "$APP" .app)" > run.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 $PID 2>/dev/null; then echo "Ứng dụng chạy được sau 20 giây"; kill $PID; exit 0; fi
          echo "Ứng dụng thoát sớm:"; cat run.log
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5
          f="$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)"
          [ -n "$f" ] && python3 -c "
          import json,sys
          t=open(sys.argv[1]).read().split('\n',1)
          d=json.loads(t[1])
          print(json.dumps({k:d.get(k) for k in ('exception','termination','asi','crashed','faultingThread','codeSigningID','codeSigningFlags')},indent=1,ensure_ascii=False))
          th=d['threads'][d.get('faultingThread',0)]
          imgs=d.get('usedImages',[])
          for fr in th.get('frames',[])[:25]:
            im=imgs[fr['imageIndex']] if fr.get('imageIndex') is not None and fr['imageIndex']<len(imgs) else {}
            print(im.get('name'), fr.get('symbol'), fr.get('imageOffset'))
          " "$f"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: tlvb-${{ matrix.target }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error

  # Mở thử bản Intel (x64) trên máy Mac chip Intel trước khi phát hành.
  test-mac-intel:
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tlvb-mac
          path: out
      - name: Cài từ .dmg và mở thử
        run: |
          sw_vers; uname -m
          DMG="$(ls out/*-mac-x64.dmg)"
          MNT="$(hdiutil attach -nobrowse "$DMG" | awk -F'\t' '/\/Volumes\//{print $NF}')"
          cp -R "$MNT"/*.app /Applications/
          hdiutil detach "$MNT"
          APP="$(ls -d /Applications/Tro\ Ly\ Van\ Ban\ AI.app)"
          xattr -cr "$APP"
          lipo -archs "$APP/Contents/MacOS/$(basename "$APP" .app)"
          /usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$APP/Contents/Info.plist" || true
          "$APP/Contents/MacOS/$(basename "$APP" .app)" > run.log 2>&1 &
          PID=$!
          sleep 25
          if kill -0 $PID 2>/dev/null; then echo "Bản Intel chạy được sau 25 giây"; kill $PID; else echo "Bản Intel thoát sớm:"; cat run.log; ls ~/Library/Logs/DiagnosticReports/; exit 1; fi

  release:
    needs: [build, test-mac-intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Đọc phiên bản
        id: v
        run: |
          echo "version=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"
          node -e "const v=require('./version.json');console.log((v.notes||[]).map(n=>'- '+n).join('\n'))" > notes.md
          cat >> notes.md <<'TXT'

          ### Cài đặt
          - **Windows**: tải `TroLyVanBan-…-win-x64.exe`, chạy và làm theo hướng dẫn. Nếu Windows SmartScreen cảnh báo, chọn *Thông tin thêm → Vẫn chạy*.
          - **macOS**: chip Apple (M1, M2…) tải bản `mac-arm64.dmg`, máy Intel tải `mac-x64.dmg`. Kéo ứng dụng vào Applications. Lần đầu mở, macOS báo *không thể mở vì Apple không thể kiểm tra phần mềm độc hại*: bấm *OK*, vào *Cài đặt hệ thống → Quyền riêng tư & Bảo mật*, kéo xuống, bấm *Vẫn mở* (Open Anyway) và nhập mật khẩu máy — chỉ làm một lần. Hoặc chạy trong Terminal: `xattr -cr "/Applications/Tro Ly Van Ban AI.app"`.
          - Bản cài đặt: tài khoản tạo mới có toàn quyền; dữ liệu, tài khoản và API key chỉ lưu trên máy. Cài bản mới đè lên bản cũ, dữ liệu được giữ nguyên.
          TXT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Trợ Lý Văn Bản AI v${{ steps.v.outputs.version }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: out/*
